<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Widget demo</title>
</head>
<body>
    <h1>Widget demo</h1>
    <p>Open this page as <code>/demo.html?key=PUBLIC_KEY</code>. The chat button is in the bottom right corner.</p>
    <script>
        const key = new URLSearchParams(location.search).get("key");
        if (key) {
            const script = document.createElement("script");
            script.src = "/widget.js";
            script.dataset.key = key;
            document.body.appendChild(script);
        }
    </script>
</body>
</html>

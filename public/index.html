<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
        #log { border: 1px solid #ccc; border-radius: 8px; padding: 12px; min-height: 300px; margin-bottom: 12px; }
        .user { font-weight: bold; margin: 10px 0 4px; }
        .bot { margin: 0 0 10px; white-space: pre-wrap; }
        .links { font-size: 13px; color: #666; margin-top: 4px; }
        .links a { color: #2563eb; }
        form { display: flex; gap: 8px; }
        input { flex: 1; padding: 10px; font-size: 15px; }
        button { padding: 10px 20px; font-size: 15px; }
    </style>
</head>
<body>
    <h1>Chat test</h1>
    <div id="log"></div>
    <form id="form">
        <input id="question" placeholder="Ask a question, e.g. When is the dinner?" autocomplete="off">
        <button id="send">Ask</button>
    </form>

    <script>
        const form = document.getElementById("form");
        const input = document.getElementById("question");
        const button = document.getElementById("send");
        const log = document.getElementById("log");

        function addLine(text, className) {
            const line = document.createElement("div");
            line.className = className;
            line.textContent = text;
            log.appendChild(line);
            return line;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const question = input.value.trim();
            if (!question) return;
            input.value = "";
            button.disabled = true;

            addLine("You: " + question, "user");
            const botLine = addLine("Thinking...", "bot");

            try {
                const response = await fetch("/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: question })
                });
                const data = await response.json();
                botLine.textContent = data.answer || ("Error: " + data.error);

                if (data.sources && data.sources.length > 0) {
                    const links = document.createElement("div");
                    links.className = "links";
                    links.append("Sources: ");
                    data.sources.forEach((url, i) => {
                        const a = document.createElement("a");
                        a.href = url;
                        a.target = "_blank";
                        a.textContent = url;
                        links.appendChild(a);
                        if (i < data.sources.length - 1) links.append(", ");
                    });
                    botLine.appendChild(links);
                }
            } catch (err) {
                botLine.textContent = "Error: " + err.message;
            } finally {
                button.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
